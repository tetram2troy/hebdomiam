version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # init et analyze doivent rester à la même version : mises à jour dans
      # deux PR séparées, chacune fait échouer l'analyse CodeQL (vécu : PR 40 et 41).
      codeql-action:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Image de développement de l'API (toolchain Rust)
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
