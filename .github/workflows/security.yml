name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # tous les lundis

jobs:
  codeql:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # v3 dépréciée en décembre 2026 (annotation GitHub) — ne pas attendre la casse.
      - uses: github/codeql-action/init@v4
        with:
          # Front (TypeScript/Vue) et API (Rust).
          languages: javascript-typescript,rust
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4

  audit:
    name: Audit des dépendances npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Bloquant sur les vulnérabilités high+ des dépendances de production
      # (le front est généré au build : aucune dépendance npm ne tourne en prod).
      - run: npm audit --omit=dev --audit-level=high

  cargo-audit:
    name: Audit des dépendances Rust (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      # Action tierce épinglée par SHA (v2.0.0).
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: api
          # Paquets verrouillés mais jamais compilés (pilotes MySQL/SQLite de
          # sqlx) — justification et vérification dans api/.cargo/audit.toml.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0459

  trivy:
    name: Scan Trivy de l'image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: hebdomiam:scan
          cache-from: type=gha
      # Épinglé par SHA : l'amont a déjà renommé tous ses tags (0.x.y → v0.x.y),
      # cassant deux fois la résolution de l'action (« Set up job » en échec).
      # SHA = commit du tag v0.36.0.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hebdomiam:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
