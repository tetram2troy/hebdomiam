name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # tous les lundis

jobs:
  codeql:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # v3 dépréciée en décembre 2026 (annotation GitHub) — ne pas attendre la casse.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Bloquant sur les vulnérabilités high+ des dépendances de production
      - run: npm audit --omit=dev --audit-level=high

  trivy:
    name: Scan Trivy de l'image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: hebdomiam:scan
          cache-from: type=gha
      # Épinglé par SHA : l'amont a déjà renommé tous ses tags (0.x.y → v0.x.y),
      # cassant deux fois la résolution de l'action (« Set up job » en échec).
      # SHA = commit du tag v0.36.0.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hebdomiam:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
