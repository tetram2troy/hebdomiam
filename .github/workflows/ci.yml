name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hebdomiam
          POSTGRES_PASSWORD: hebdomiam
          POSTGRES_DB: hebdomiam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hebdomiam -d hebdomiam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NUXT_DATABASE_URL: postgresql://hebdomiam:hebdomiam@localhost:5432/hebdomiam
      NUXT_SESSION_PASSWORD: ci-session-password-at-least-32-characters!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: hebdomiam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
