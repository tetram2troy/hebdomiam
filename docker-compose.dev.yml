# Développement local : base de données + API Rust (aucun compilateur sur le poste).
#   docker compose -f docker-compose.dev.yml up -d     → db + api (rechargement à chaud)
#   npm run dev                                        → front Nuxt (proxy /api → :8080)
# La première compilation de l'API prend quelques minutes (dépendances mises
# en cache dans les volumes cargo-*).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hebdomiam
      POSTGRES_PASSWORD: hebdomiam
      POSTGRES_DB: hebdomiam
    volumes:
      - hebdomiam-db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hebdomiam -d hebdomiam"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Rust : migrations puis serveur, relancés à chaque modification de
  # api/ (scrutation : les événements de fichiers Windows ne traversent pas
  # le montage). Aussi utilisé par les scripts npm api:* (tests, lint).
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    image: hebdomiam-api-dev
    working_dir: /app/api
    command:
      - watchexec
      - --poll=1000ms
      - --restart
      - --watch=src
      - --watch=migrations
      - --watch=Cargo.toml
      # watchexec passe lui-même la commande à un shell : une seule chaîne
      # (avec « sh -c » en plus, seul « cargo » était exécuté, sans migration).
      - --
      - cargo run -- migrate && exec cargo run -- serve
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://hebdomiam:hebdomiam@db:5432/hebdomiam
      TEST_DATABASE_URL: postgresql://hebdomiam:hebdomiam@db:5432/hebdomiam_test
      PORT: "8080"
      APP_ENV: development
      # Le front est servi par `npm run dev` en développement.
      STATIC_DIR: ""
      CARGO_TARGET_DIR: /cargo-target
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./api:/app/api
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/cargo-target
    depends_on:
      db:
        condition: service_healthy

volumes:
  hebdomiam-db-dev:
  cargo-registry:
  cargo-target:
